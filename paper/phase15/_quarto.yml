project:
  type: manuscript
  output-dir: output
  render:
    - index.qmd

manuscript:
  article: index.qmd
  notebooks:
    - notebook: notebooks/phase15_discovery.ipynb
      title: Phase 15 discovery notebook

bibliography: references.bib

filters:
  - filters/format-figures.lua

execute:
  freeze: auto

format:
  html:
    toc: true
    toc-depth: 3
    theme:
      - cosmo
      - styles/paper.scss
    code-fold: true
    link-external-newwindow: true
  pdf:
    pdf-engine: lualatex
    documentclass: scrartcl
    papersize: letter
    fontsize: 10pt
    geometry:
      - margin=1in
    toc: true
    toc-depth: 1
    number-sections: true
    colorlinks: true
    keep-tex: true
    fig-pos: tbp

crossref:
  fig-title: Figure
  tbl-title: Table
  eq-prefix: Eq.
  sec-prefix: Section

lang: en
